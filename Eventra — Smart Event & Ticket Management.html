<script>

const KEY="eventra_single_file_v1";
const uid=(prefix="id")=>prefix+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const dateText=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";

  ];
  const tiers=[];
  events.forEach((e,idx)=>{
    tiers.push(
      {id:uid("tier"),eventId:e.id,name:"Early Bird",price:199+idx*20,quantity:80,sold:idx===0?46:idx===1?55:22,benefits:["Event entry","Limited availability"]},
      {id:uid("tier"),eventId:e.id,name:"General",price:299+idx*30,quantity:120,sold:idx===0?72:idx===1?42:34,benefits:["Event entry","Standard seating"]},

  const attendees=[

    ["Aisha M","aisha@example.com","9876543213"],["Rahul P","rahul@example.com","9876543214"],["Nila V","nila@example.com","9876543215"],
    ["Sanjay K","sanjay@example.com","9876543216"],["Dhivya R","dhivya@example.com","9876543217"],["Vishnu S","vishnu@example.com","9876543218"],
    ["Harini J","harini@example.com","9876543219"],["Aditya N","aditya@example.com","9876543220"],["Keerthana P","keerthana@example.com","9876543221"],
    ["Surya M","surya@example.com","9876543222"],["Priya K","priya@example.com","9876543223"],["Dinesh R","dinesh@example.com","9876543224"],
    ["Ananya S","ananya@example.com","9876543225"],["Vikram A","vikram@example.com","9876543226"],["Swetha V","swetha@example.com","9876543227"],
    ["Gokul T","gokul@example.com","9876543228"],["Janani R","janani@example.com","9876543229"]

  const orders=[],tickets=[];
  attendees.forEach((a,i)=>{

    const order={id:uid("ord"),eventId:e.id,attendeeId:a.id,ticketTypeId:tier.id,amount:tier.price,status:"PAID",createdAt:new Date(Date.now()-i*86400000).toISOString()};

let db=JSON.parse(localStorage.getItem(KEY)||"null")||seed();
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function resetDemo(){db=seed();save();location.reload();}
let session=JSON.parse(sessionStorage.getItem("eventra_session")||"null");
function setSession(s){session=s;sessionStorage.setItem("eventra_session",JSON.stringify(s))}
function logout(){session=null;sessionStorage.removeItem("eventra_session");go("#/");}

function toast(msg,type=""){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML="",3000)}
function go(path){location.hash=path}
function currentRoute(){return location.hash.replace(/^#/,"")||"/"}
function eventById(id){return db.events.find(e=>e.id===id)}
function tierById(id){return db.ticketTypes.find(t=>t.id===id)}
function attendeeById(id){return db.attendees.find(a=>a.id===id)}
function ticketById(id){return db.tickets.find(t=>t.id===id)}
function organizerTickets(){return db.tickets.filter(t=>t.eventId && eventById(t.eventId)?.organizerId==="org-demo")}
function soldCount(){return db.orders.length}
function revenue(){return db.orders.reduce((s,o)=>s+o.amount,0)}
function checkedInCount(){return db.tickets.filter(t=>t.status==="CHECKED_IN").length}

function verifyTicket(raw){
 const id=String(raw).trim().replace(/^https?:\/\/.*\//,"");
 const t=db.tickets.find(x=>x.id===id||x.qrCode===id);
 const box=document.getElementById("scanResult");if(!box)return;
 if(!t){box.innerHTML=`<div class="card panel scan-result result-invalid"><div class="result-icon">❌</div><h2>Invalid Ticket</h2><p>This ticket could not be verified.</p></div>`;return}
 const a=attendeeById(t.attendeeId),e=eventById(t.eventId);
 if(t.status==="CHECKED_IN"){box.innerHTML=`<div class="card panel scan-result result-warn"><div class="result-icon">⚠️</div><h2>Already Checked In</h2><p>This ticket was already used${t.checkedInAt?" at "+new Date(t.checkedInAt).toLocaleTimeString():""}.</p><div class="grid grid-3"><div><small class="muted">Attendee</small><strong>${esc(a.name)}</strong></div><div><small class="muted">Ticket</small><strong>${esc(t.ticketType)}</strong></div><div><small class="muted">ID</small><strong>${esc(t.id)}</strong></div></div></div>`;return}
 box.innerHTML=`<div class="card panel scan-result result-valid"><div class="result-icon">✓</div><h2>Ticket Verified</h2><p>Valid ticket for <strong>${esc(e.name)}</strong>.</p><div class="grid grid-3"><div><small class="muted">Attendee</small><strong>${esc(a.name)}</strong></div><div><small class="muted">Ticket</small><strong>${esc(t.ticketType)}</strong></div><div><small class="muted">Ticket ID</small><strong>${esc(t.id)}</strong></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="confirmCheckIn('${t.id}')">Check In Attendee</button></div>`;
}
function confirmCheckIn(id){const t=ticketById(id);if(!t)return;if(t.status==="CHECKED_IN"){toast("Already checked in.","error");return}t.status="CHECKED_IN";t.checkedInAt=new Date().toISOString();save();toast("✓ Successfully checked in.","success");verifyTicket(id)}

function analytics(){
 if(!session||session.role!=="organizer"){go("#/login");return}
 const tickets=organizerTickets(),sold=tickets.length,checked=tickets.filter(t=>t.status==="CHECKED_IN").length;
 layout(`<div class="app-shell">${side("analytics")}<main class="main"><div class="page-title"><div><h1>Analytics</h1><p>Understand ticket performance and attendance.</p></div></div>
 <div class="stats"><div class="card stat"><small>Total Revenue</small><strong>${money(revenue())}</strong><div class="delta">Live demo data</div></div><div class="card stat"><small>Tickets Sold</small><strong>${sold}</strong><div class="delta">Across your events</div></div><div class="card stat"><small>Attendance</small><strong>${sold?Math.round(checked/sold*100):0}%</strong><div class="delta">${checked} checked in</div></div><div class="card stat"><small>Conversion Rate</small><strong>42%</strong><div class="delta">Demo metric</div></div></div>
 <div class="dashboard-grid"><div class="card panel"><h3>Revenue over time</h3><div class="chart-wrap"><canvas id="revChart"></canvas></div></div><div class="card panel"><h3>Ticket type performance</h3><div class="chart-wrap"><canvas id="typeChart"></canvas></div></div></div>
 </main></div>`);
 setTimeout(()=>{new Chart(document.getElementById("revChart"),{type:"line",data:{labels:["Apr","May","Jun","Jul","Aug","Sep","Oct"],datasets:[{label:"Revenue",data:[18000,29000,41000,52000,68000,84000,97000],borderColor:"#635bff",tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});const types={};db.ticketTypes.forEach(t=>types[t.name]=(types[t.name]||0)+t.sold);new Chart(document.getElementById("typeChart"),{type:"doughnut",data:{labels:Object.keys(types),datasets:[{data:Object.values(types),backgroundColor:["#635bff","#12b76a","#f79009"]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}})},50);
}

function createEvent(){
 if(!session){go("#/login");return}
 let step=1,tickets=[{name:"General",price:299,quantity:100,benefits:"Event entry, Standard seating"}];
 const render=()=>{layout(`<main class="section"><div class="container" style="max-width:900px"><div class="page-title"><div><h1>Create an Event</h1><p>Turn an idea into a live event.</p></div></div><div class="steps">${[1,2,3].map(x=>`<div class="step ${x<=step?"active":""}"></div>`).join("")}</div><div id="wizard"></div></div></main>`);drawStep()};
 const basic=()=>{return `<div class="card panel"><h2>1. Basic details</h2><div class="form-grid"><div class="field full"><label>Event name *</label><input id="ename" placeholder="e.g. FutureTech Summit"></div><div class="field"><label>Category</label><select id="ecat"><option>Technology</option><option>Music</option><option>Business</option><option>Design</option><option>Sports</option></select></div><div class="field"><label>Date</label><input id="edate" type="date"></div><div class="field"><label>Start time</label><input id="etime" type="time" value="09:00"></div><div class="field"><label>End time</label><input id="eend" type="time" value="18:00"></div><div class="field"><label>Venue</label><input id="evenue" placeholder="Event venue"></div><div class="field"><label>City</label><input id="ecity" placeholder="Chennai"></div><div class="field full"><label>Description</label><textarea id="edesc" placeholder="What should attendees know?"></textarea></div><div class="field full"><label>Event banner URL (optional)</label><input id="eimage" placeholder="https://..."></div></div><div class="hero-actions" style="justify-content:flex-end"><button class="btn btn-primary" onclick="nextCreate()">Continue →</button></div></div>`};
 const ticketsStep=()=>`<div class="card panel"><h2>2. Ticket types</h2><p class="muted">Set price, inventory and benefits.</p><div id="ticketEditor">${tickets.map((t,i)=>`<div class="card panel" style="margin:12px 0;background:#fafbfc"><div class="form-grid"><div class="field"><label>Ticket name</label><input data-i="${i}" data-k="name" value="${esc(t.name)}"></div><div class="field"><label>Price (₹)</label><input data-i="${i}" data-k="price" type="number" value="${t.price}"></div><div class="field"><label>Quantity</label><input data-i="${i}" data-k="quantity" type="number" value="${t.quantity}"></div><div class="field"><label>Benefits</label><input data-i="${i}" data-k="benefits" value="${esc(t.benefits)}"></div></div></div>`).join("")}</div><button class="btn btn-secondary" onclick="tickets.push({name:'VIP',price:699,quantity:50,benefits:'Priority entry, Premium seating, Goodie bag'});drawStep()">+ Add Ticket Type</button><div class="hero-actions" style="justify-content:space-between"><button class="btn btn-secondary" onclick="step=1;render()">← Back</button><button class="btn btn-primary" onclick="nextCreate()">Review →</button></div></div>`;
 const review=()=>`<div class="card panel"><span class="tag live">READY TO PUBLISH</span><h2 style="margin-top:12px">${esc(document.getElementById("ename")?.value||"Your Event")}</h2><p class="muted">${esc(document.getElementById("edesc")?.value||"Event description")}</p><div class="grid grid-3" style="margin:20px 0"><div><small class="muted">Date</small><strong style="display:block">${dateText(document.getElementById("edate")?.value)}</strong></div><div><small class="muted">Time</small><strong style="display:block">${document.getElementById("etime")?.value||"09:00"}</strong></div><div><small class="muted">Venue</small><strong style="display:block">${esc(document.getElementById("evenue")?.value||"—")}</strong></div></div><h3>Ticket tiers</h3>${tickets.map(t=>`<div class="summary-row"><span>${esc(t.name)} · ${t.quantity} seats</span><strong>${money(t.price)}</strong></div>`).join("")}<div class="hero-actions" style="justify-content:space-between"><button class="btn btn-secondary" onclick="step=2;render()">← Back</button><button class="btn btn-primary" onclick="publishCreated()">🎉 Publish Event</button></div></div>`;
 const drawStep=()=>{document.getElementById("wizard").innerHTML=step===1?basic():step===2?ticketsStep():review();if(step===2){document.querySelectorAll("#ticketEditor input").forEach(el=>el.oninput=()=>{tickets[+el.dataset.i][el.dataset.k]=el.dataset.k==="price"||el.dataset.k==="quantity"?Number(el.value):el.value})}};
 window.nextCreate=()=>{if(step===1){if(!document.getElementById("ename").value.trim()){toast("Please enter the event name.","error");return}if(!document.getElementById("edate").value){toast("Please select an event date.","error");return}step=2;render()}else{step=3;render()}};
 window.publishCreated=()=>{const e={id:uid("evt"),name:document.getElementById("ename").value.trim(),category:document.getElementById("ecat").value,description:document.getElementById("edesc").value.trim(),date:document.getElementById("edate").value,time:document.getElementById("etime").value,endTime:document.getElementById("eend").value,venue:document.getElementById("evenue").value.trim(),city:document.getElementById("ecity").value.trim(),organizerId:"org-demo",image:document.getElementById("eimage").value.trim(),status:"LIVE"};db.events.unshift(e);tickets.forEach(t=>db.ticketTypes.push({id:uid("tier"),eventId:e.id,name:t.name,price:Number(t.price),quantity:Number(t.quantity),sold:0,benefits:String(t.benefits).split(",").map(x=>x.trim()).filter(Boolean)}));save();document.getElementById("wizard").innerHTML=`<div class="card panel" style="text-align:center;padding:55px"><div style="font-size:55px">🎉</div><h1>Your event is live!</h1><p class="muted">Judges can now explore it and purchase a demo ticket.</p><div class="hero-actions" style="justify-content:center"><a class="btn btn-secondary" href="#/events/${e.id}">View Event</a><a class="btn btn-primary" href="#/events/manage">Manage Event</a></div></div>`};
 render();
}

function myTickets(){
 const mine=session?db.tickets.filter(t=>t.attendeeId===(db.attendees.find(a=>a.email===session.email)?.id||"")):db.tickets.slice(0,8);
 layout(`<main class="section"><div class="container"><div class="page-title"><div><h1>My Tickets</h1><p>Your digital event passes in one place.</p></div><a class="btn btn-primary" href="#/explore">Explore Events</a></div><div class="grid grid-3">${mine.map(t=>{const e=eventById(t.eventId);return `<div class="card panel"><span class="tag ${t.status==="CHECKED_IN"?"live":""}">${t.status==="CHECKED_IN"?"CHECKED IN":"VALID"}</span><h2 style="font-size:20px">${esc(e.name)}</h2><p class="muted">${dateText(e.date)} · ${esc(e.city)}</p><div class="summary-row"><span>${esc(t.ticketType)}</span><strong>${esc(t.id)}</strong></div><a class="btn btn-primary" style="width:100%" href="#/ticket/${t.id}">View QR Ticket</a></div>`}).join("")||`<div class="card empty" style="grid-column:1/-1">No tickets yet. Explore an event and book a demo ticket.</div>`}</div></div></main>`);
}

function router(){
 const r=currentRoute(),parts=r.split("/").filter(Boolean);
 if(r==="/"||!r){landing();return}
 if(parts[0]==="explore"){explore();return}
 if(parts[0]==="login"){login();return}
 if(parts[0]==="create"){createEvent();return}
 if(parts[0]==="events"&&parts[1]==="manage"){manageEvents();return}
 if(parts[0]==="events"&&parts[1]){eventDetails(parts[1]);return}
 if(parts[0]==="checkout"&&parts[1]&&parts[2]){checkout(parts[1],parts[2]);return}
 if(parts[0]==="payment-success"&&parts[1]){paymentSuccess(parts[1]);return}
 if(parts[0]==="ticket"&&parts[1]){digitalTicket(parts[1]);return}
 if(parts[0]==="dashboard"){dashboard();return}
 if(parts[0]==="attendees"){attendees();return}
 if(parts[0]==="scanner"){scanner();return}
 if(parts[0]==="analytics"){analytics();return}
 if(parts[0]==="my-tickets"){myTickets();return}
 if(parts[0]==="organizer"){dashboard();return}
 landing();
}
window.addEventListener("hashchange",router);window.addEventListener("load",router);
</script>


</body></html>
